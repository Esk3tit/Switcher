name: Fork release

# Tags main as the fork's next release and starts the Release workflow on the
# tag. After a push to main it does so only when the push brought in upstream
# commits the newest fork release lacks, as merging an upstream sync does;
# run by hand, it releases main as it is. build/fork-release.sh decides, and
# picks the tag: vX.Y.Z.N, the Nth fork release of upstream's VERSION X.Y.Z.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only say which tag would be released
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, so two pushes never pick the same tag.
concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/00xmario/Switcher.git

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag
      actions: write # starting the Release workflow
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Read only, anonymously: whether this push merged upstream commits.
      - name: Fetch upstream
        if: github.event_name == 'push'
        run: git fetch --no-tags --quiet "$UPSTREAM_URL" main:refs/remotes/upstream/main

      - name: Decide
        id: plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Only main is released, not $GITHUB_REF." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            build/fork-release.sh auto refs/remotes/upstream/main
          else
            build/fork-release.sh dispatch
          fi

      - name: Tag and release
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Tagged $GITHUB_SHA as $TAG and started the Release workflow on it." >> "$GITHUB_STEP_SUMMARY"

      - name: Say what was decided
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
          REASON: ${{ steps.plan.outputs.reason }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$RELEASE" != true ]; then
            echo "Not released: $REASON." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = true ]; then
            echo "Dry run: would tag $GITHUB_SHA as $TAG ($REASON)." >> "$GITHUB_STEP_SUMMARY"
          fi
