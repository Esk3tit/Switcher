name: Release

# The fork numbers its releases on its own, in FORK_VERSION (VERSION is
# upstream's), and tags them fork-vX.Y.Z: the fork's repository also holds
# upstream's vX.Y.Z tags, which release nothing here. The Fork release
# workflow starts this one on the tag it made: a tag pushed with the
# workflow token starts no workflow by itself.
on:
  push:
    tags:
      - 'fork-v*'
  workflow_dispatch:

# Only the release job may write, and only releases. Actions are pinned to
# commits, so a moved tag cannot change what builds a release.
permissions:
  contents: read

jobs:
  # The Go and web checks on Linux itself, where the tray, keep awake and
  # login service are native. The release waits for them.
  verify-linux:
    runs-on: ubuntu-24.04
    outputs:
      upstream-version: ${{ steps.upstream.outputs.version }}
      upstream-commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # fork-vX.Y.Z for FORK_VERSION's X.Y.Z, and a tag: run by hand on a
      # branch, nothing is released.
      - name: Release only the tag of FORK_VERSION
        run: |
          set -euo pipefail
          version=$(cat FORK_VERSION)
          case "$GITHUB_REF" in refs/tags/*) ;; *) echo "$GITHUB_REF is not a tag; nothing is released." >&2; exit 1 ;; esac
          if ! printf '%s\n' "$version" | grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then
            echo "FORK_VERSION is not X.Y.Z: $version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "fork-v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not fork-v$version, which FORK_VERSION names; nothing is released." >&2
            exit 1
          fi

      # The upstream commit this release is built on: the newest one of
      # upstream's main that the tagged commit holds, and the VERSION there.
      - name: Find the upstream base
        id: upstream
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags https://github.com/00xmario/Switcher.git main
          commit=$(git merge-base HEAD FETCH_HEAD)
          version=$(git show "$commit:VERSION")
          printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'
          echo "Upstream base: Switcher $version, commit $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release is built only from a commit that is on main: a tag on any
      # other commit, such as a branch nobody reviewed, releases nothing.
      - name: Release only what is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "The tag $GITHUB_REF_NAME is not on main ($status); nothing is released." >&2; exit 1 ;;
          esac

      - name: Verify on Linux
        run: make verify-linux

  # The checks on a Mac, in a job of their own: the tests run code of the
  # repository and its dependencies, and nothing they do may reach the job
  # that builds what ships.
  verify-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: make verify
      # Keychain writes through /usr/bin/security, on a throwaway keychain of this runner.
      - name: Verify Keychain writes
        run: build/macos/keychain-test.sh

  # Builds every file of the release. It can write nothing: the installer's
  # disk image is made with a third-party tool (dmgbuild, pinned by hash),
  # so no build step shares a job with the release's write access or with
  # the attestation's signing identity.
  build:
    needs: [verify-linux, verify-mac]
    runs-on: macos-15
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # What ships is built from the checkout alone, not from a cache
          # another run filled.
          cache: false

      - name: Build plain binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#fork-v}"
          mkdir -p dist
          # The optional "Away from home" Tailscale add-on, downloaded by
          # Switcher only when a user turns it on. Its digest is built into
          # the matching Switcher binary, which trusts nothing else.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            (cd cmd/switcher-tailnet && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "../../dist/switcher-tailnet_${VERSION}_${os}_${arch}" .)
            sum=$(shasum -a 256 "dist/switcher-tailnet_${VERSION}_${os}_${arch}" | cut -d' ' -f1)
            echo "ADDON_SHA256_${os}_${arch}=${sum}" >> "$GITHUB_ENV"
            eval "ADDON_SHA256_${os}_${arch}=${sum}"
          done
          # The plain binaries: the Linux install and its updater use them,
          # tray included (switcher tray); Linux builds need no cgo.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            eval "addon=\${ADDON_SHA256_${os}_${arch}}"
            cgo=0
            if [ "$os" = darwin ]; then cgo=1; fi
            CGO_ENABLED="$cgo" GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X switcher/internal/remote.addonSHA256=${addon}" \
              -o "dist/switcher-server_${VERSION}_${os}_${arch}" .
          done
          cd dist
          for f in switcher-server_* switcher-tailnet_*; do
            shasum -a 256 "$f" | tee "$f.sha256"
          done

      - name: Build macOS app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#fork-v}"
          APP="build/Switcher.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp build/macos/logos/*.svg build/macos/MenubarTemplate*.png "$APP/Contents/Resources/"
          cp THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/ThirdPartyNotices.md"
          sed "s/VERSION_TOKEN/${VERSION}/g" build/macos/Info.plist > "$APP/Contents/Info.plist"
          # One app for every Mac: Apple silicon and Intel slices, back to
          # macOS 13. Without an explicit target swiftc would require the
          # runner's own macOS version.
          SLICES="build/slices"
          rm -rf "$SLICES"
          mkdir -p "$SLICES"
          for arch in arm64 amd64; do
            eval "addon=\${ADDON_SHA256_darwin_${arch}}"
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X switcher/internal/remote.addonSHA256=${addon}" \
              -o "$SLICES/SwitcherServer-$arch" .
          done
          lipo -create -output "$APP/Contents/MacOS/SwitcherServer" "$SLICES/SwitcherServer-arm64" "$SLICES/SwitcherServer-amd64"
          for target in arm64-apple-macos13.0 x86_64-apple-macos13.0; do
            swiftc -parse-as-library -O -target "$target" -o "$SLICES/Switcher-$target" build/macos/menubar.swift
          done
          lipo -create -output "$APP/Contents/MacOS/Switcher" "$SLICES"/Switcher-*-apple-macos13.0
          for binary in Switcher SwitcherServer; do
            archs=$(lipo -archs "$APP/Contents/MacOS/$binary")
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "$binary is not universal: $archs" >&2; exit 1 ;; esac
          done
          # Ad-hoc signing: without it Apple Silicon reports quarantined
          # builds as "damaged".
          codesign --force --deep -s - "$APP"

      - name: Package drag-to-Applications DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#fork-v}"
          STAGE="build/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "build/Switcher.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname "Switcher $VERSION" -srcfolder "$STAGE" \
              -ov -format UDZO "dist/Switcher_${VERSION}.dmg" && break
            if [ "$attempt" -eq 3 ]; then
              echo "hdiutil failed after 3 attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt $attempt failed; retrying in 5s"
            sleep 5
          done

      # What people download: Install Switcher.app, which carries the same
      # Switcher.app as the DMG above, behind a window that explains the one
      # step macOS asks for.
      - name: Build the installer disk image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#fork-v}"
          build/macos/installer/build.sh "$VERSION" build/Switcher.app dist/Install-Switcher.dmg

      - name: Checksum DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#fork-v}"
          # Releases before 1.31 check the DMG against this.
          cd dist
          shasum -a 256 "Switcher_${VERSION}.dmg" | tee "Switcher_${VERSION}.dmg.sha256"
          shasum -a 256 Install-Switcher.dmg | tee Install-Switcher.dmg.sha256

      - name: Hand the files to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [verify-linux, build]
    runs-on: ubuntu-24.04
    # Writes the release, and GitHub's attestations of where each file was
    # built, which build/release-sign.sh checks before it signs. It runs
    # only GitHub's own actions and tools, and ssh-keygen to sign.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Take the files from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist

      # The release's version, which the updater reads from the newest
      # release when the release API refuses it.
      - name: Name the version
        run: printf '%s\n' "${GITHUB_REF_NAME#fork-v}" > dist/VERSION

      # One list of every file's checksum. The release is signed by signing
      # this list; updaters and install.sh from 1.31 trust nothing else.
      - name: List checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            case "$f" in
              *.sha256 | SHA256SUMS* | VERSION) ;;
              *) shasum -a 256 "$f" ;;
            esac
          done > SHA256SUMS
          cat SHA256SUMS

      # GitHub's signed statement that this workflow built each listed file
      # from this commit for this tag, on its own runners.
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Take the keys install.sh trusts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Signed here with the SWITCHER_RELEASE_SIGNING_KEY secret, and checked
      # against the keys install.sh and the app trust (internal/fork). Without
      # the secret the release stays a draft, to be signed away from GitHub
      # with build/release-sign.sh.
      - name: Sign the list of checksums
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SWITCHER_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SWITCHER_RELEASE_SIGNING_KEY secret: $GITHUB_REF_NAME stays a draft until build/release-sign.sh signs it."
            exit 0
          fi
          if grep -qx "release_signers=''" src/install.sh; then
            echo "install.sh trusts no release key yet; run build/fork-release-key.sh and commit what it writes." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          ssh-keygen -q -Y sign -f "$key" -n switcher-release dist/SHA256SUMS < /dev/null
          sed -n "/^release_signers='/,/'\$/p" src/install.sh | sed "s/^release_signers='//; s/'\$//" > "$RUNNER_TEMP/allowed_signers"
          if ! ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I switcher-release -n switcher-release \
              -s dist/SHA256SUMS.sig < dist/SHA256SUMS > /dev/null; then
            echo "SWITCHER_RELEASE_SIGNING_KEY is not a key install.sh trusts." >&2
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Signed, it is published as the latest release, which updaters and
      # install.sh take. A draft is seen by none of them.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
          UPSTREAM_VERSION: ${{ needs.verify-linux.outputs.upstream-version }}
          UPSTREAM_COMMIT: ${{ needs.verify-linux.outputs.upstream-commit }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#fork-v}"
          if [ "$SIGNED" = true ]; then
            publish=(--latest)
          else
            publish=(--draft)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${publish[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Switcher $VERSION, this fork's release. Upstream base: Switcher $UPSTREAM_VERSION, 00xmario/Switcher commit \`$UPSTREAM_COMMIT\`." \
            --generate-notes
